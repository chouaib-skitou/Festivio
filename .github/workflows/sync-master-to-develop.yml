name: Sync master to develop

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-master-to-develop
  cancel-in-progress: false

jobs:
  open-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Open master to develop PR when needed
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        shell: bash
        run: |
          git fetch origin develop master

          master_tree=$(git rev-parse 'origin/master^{tree}')
          develop_tree=$(git rev-parse 'origin/develop^{tree}')
          if [ "$master_tree" = "$develop_tree" ]; then
            echo "develop and master have identical trees; no sync PR needed"
            exit 0
          fi

          if [ "$(git rev-list --count origin/develop..origin/master)" -eq 0 ]; then
            echo "develop already contains master"
            exit 0
          fi

          existing=$(gh pr list --state open --base develop --head master --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Sync PR #$existing already exists"
            exit 0
          fi

          if gh pr create \
            --base develop \
            --head master \
            --title "chore: sync master into develop" \
            --body "Automated synchronization PR. Merge normally after checks pass; this workflow never force-updates develop."; then
            echo "Sync PR created"
          else
            echo "::warning title=Sync PR not created::GitHub denied pull request creation. Enable repository Actions setting 'Allow GitHub Actions to create and approve pull requests' or add a SYNC_PR_TOKEN secret with permission to create PRs, then rerun this workflow."
            exit 0
          fi
